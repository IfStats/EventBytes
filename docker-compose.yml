services:
  postgres:
    image: postgres:16
    container_name: eventbytes-postgres
    restart: always
    environment:
      POSTGRES_USER: eventbytes
      POSTGRES_PASSWORD: eventbytes_password
      POSTGRES_DB: eventbytes
    ports:
      - "5432:5432"
    volumes:
      - eventbytes_postgres_data:/var/lib/postgresql/data

volumes:
  eventbytes_postgres_data: