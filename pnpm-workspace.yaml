packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - workerd
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - prisma
  - sharp
  - unrs-resolver
